name: Security CI

on: [push, pull_request]

permissions:
  contents: read

env:
  # gitleaks is a Go binary, not a PyPI package: pinned release + checksum
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run bandit (SAST)
        run: bandit -r core local_connectors -f json -o bandit-report.json || true

      - name: Run pip-audit (SCA)
        # Advisory only: upstream CVEs must not block unrelated commits.
        run: pip-audit -r requirements.txt --format json -o audit-report.json || true

      - name: Run gitleaks (secret scanning)
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSL --fail -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$archive" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP/gitleaks" gitleaks
          chmod +x "$RUNNER_TEMP/gitleaks/gitleaks"
          "$RUNNER_TEMP/gitleaks/gitleaks" version
          # Scan the whole history (fetch-depth: 0), not just the checked-out tree.
          "$RUNNER_TEMP/gitleaks/gitleaks" git . \
            --report-path gitleaks-report.json \
            --redact

      - name: Check bandit results
        if: hashFiles('bandit-report.json') != ''
        run: |
          python - <<'PY'
          import json
          import sys

          with open("bandit-report.json", encoding="utf-8") as fh:
              report = json.load(fh)

          # bandit's JSON formatter names the field "issue_severity", not "severity".
          high = [r for r in report.get("results", []) if r.get("issue_severity") == "HIGH"]

          for finding in high:
              print(
                  "::error file={filename},line={line_number}::{test_id} {issue_text}".format(**finding)
              )

          if high:
              print(f"HIGH severity issues found in SAST: {len(high)}")
              sys.exit(1)

          print("SAST: no HIGH severity issues")
          PY

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            audit-report.json
            gitleaks-report.json
          if-no-files-found: warn
